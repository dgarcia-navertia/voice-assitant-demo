# PRODUCCION detras del Traefik compartido del VPS (repo srv1576694.hstgr.cloud).
# Ningun servicio publica puertos: Traefik (80/443, TLS de Let's Encrypt) enruta
# por labels a php y bot a traves de la red externa `web`. La base de datos solo
# esta en `backend` (interna); no hay phpMyAdmin. Imagenes multi-stage, procesos
# no root, healthchecks y restart automatico.
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Requisitos: Traefik del VPS arriba (crea la red `web`), DNS A de
# demo-llamada.navertia.com al VPS, PUBLIC_BASE_URL=https://demo-llamada.navertia.com
# y el resto de secretos en .env.
name: navertia-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# La red `web` la comparten otros stacks (p. ej. la agenda tambien tiene un
# servicio `php`): los nombres cortos `php`/`bot`/`db` serian ambiguos. Por eso
# los servicios se hablan por alias unicos en `backend` y estas URLs pisan las
# del .env.
x-internal-env: &internal-env
  DB_HOST: demo-llamada-db
  PHP_API_BASE_URL: http://demo-llamada-php:8080
  BOT_BASE_URL: http://demo-llamada-bot:7860

services:
  php:
    build:
      context: ./calendar
      dockerfile: docker/Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *internal-env
      APP_ENV: production
    networks:
      web: {}
      backend:
        aliases: [demo-llamada-php]
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/lock/apache2
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=true"
      # Obligatorio: el servicio esta en dos redes (web + backend) y sin esta
      # label Traefik puede elegir la IP de `backend` y devolver 504.
      - "traefik.docker.network=web"
      - "traefik.http.routers.demo-llamada-php.rule=Host(`${APP_DOMAIN:?APP_DOMAIN es obligatorio}`)"
      - "traefik.http.routers.demo-llamada-php.entrypoints=websecure"
      - "traefik.http.routers.demo-llamada-php.tls.certresolver=le"
      - "traefik.http.routers.demo-llamada-php.middlewares=demo-llamada-secheaders@docker"
      - "traefik.http.services.demo-llamada-php.loadbalancer.server.port=8080"
      # Cabeceras de seguridad (antes en el Caddyfile). Nombre propio para no
      # chocar con el `secheaders` de otros stacks del VPS.
      - "traefik.http.middlewares.demo-llamada-secheaders.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.demo-llamada-secheaders.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.demo-llamada-secheaders.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.demo-llamada-secheaders.headers.frameDeny=true"
      - "traefik.http.middlewares.demo-llamada-secheaders.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.demo-llamada-secheaders.headers.permissionsPolicy=camera=(), microphone=(), geolocation=()"
    logging: *logging

  # Aplica las migraciones de Phinx y termina. Los seeders de desarrollo
  # (usuarios con contrasena conocida) NO se ejecutan en produccion.
  migrate:
    build:
      context: ./calendar
      dockerfile: docker/Dockerfile.prod
    restart: "no"
    env_file: .env
    environment: *internal-env
    command: ["php", "vendor/bin/phinx", "migrate"]
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  bot:
    build:
      context: ./bot
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *internal-env
      # El cliente de prueba de WebRTC no se expone en produccion.
      ENABLE_WEBRTC: "false"
    # `web` tambien le da salida a Internet (Twilio, Deepgram, ElevenLabs, LLM).
    networks:
      web: {}
      backend:
        aliases: [demo-llamada-bot]
    depends_on:
      php:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7860/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # Solo /ws (Media Streams, wss) y /twilio/* (webhooks). POST /dial-out NO
      # se publica: lo llama PHP por `backend`. Prioridad por encima del router
      # de php, que casa con todo el dominio.
      - "traefik.http.routers.demo-llamada-bot.rule=Host(`${APP_DOMAIN:?APP_DOMAIN es obligatorio}`) && (Path(`/ws`) || PathPrefix(`/ws/`) || PathPrefix(`/twilio/`))"
      - "traefik.http.routers.demo-llamada-bot.priority=100"
      - "traefik.http.routers.demo-llamada-bot.entrypoints=websecure"
      - "traefik.http.routers.demo-llamada-bot.tls.certresolver=le"
      - "traefik.http.routers.demo-llamada-bot.middlewares=demo-llamada-secheaders@docker"
      - "traefik.http.services.demo-llamada-bot.loadbalancer.server.port=7860"
    logging: *logging

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?obligatorio}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD:?obligatorio}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      backend:
        aliases: [demo-llamada-db]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *logging

volumes:
  db_data:

networks:
  # web: red externa compartida con Traefik y el resto de stacks del VPS (la
  # crea el repo de Traefik: `docker network create web`; este compose no la
  # crea ni la destruye). backend: php/bot/migrate <-> db, interna (sin salida a
  # Internet).
  web:
    external: true
  backend:
    internal: true
