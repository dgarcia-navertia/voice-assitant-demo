<VirtualHost *:8080>
    ServerName localhost
    # Solo public/ es servible: config/, app/, vendor/ nunca por HTTP.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "|/bin/cat 1>&2"
    CustomLog "|/bin/cat" combined
</VirtualHost>
